backend:
  name: github
  repo: BryanRT28/Limpyzas-maqueta  # Tu repositorio en GitHub
  branch: main
  base_url: https://decap-cms-oauth.vercel.app

media_folder: "img"
public_folder: "/img"

collections:
  - name: "configuracion"
    label: "Configuración del Sitio"
    files:
      - file: "data/contacto.json"
        label: "Datos de Contacto"
        name: "datos_empresa"
        fields:
          - { label: "Teléfono / WhatsApp (ej: 908 643 336)", name: "telefono_texto", widget: "string" }
          - { label: "Número WhatsApp sin espacios (ej: 51908643336)", name: "telefono_num", widget: "string" }
          - { label: "Dirección de la Oficina", name: "direccion", widget: "string" }
          - { label: "Enlace Google Maps", name: "maps_url", widget: "string" }
          - { label: "Correo Electrónico", name: "correo", widget: "string" }
          - label: "Redes Sociales"
            name: "redes"
            widget: "object"
            fields:
              - { label: "Facebook URL", name: "facebook", widget: "string" }
              - { label: "Instagram URL", name: "instagram", widget: "string" }
              - { label: "TikTok URL", name: "tiktok", widget: "string" }

      - file: "data/faq.json"
        label: "Preguntas Frecuentes"
        name: "preguntas_frecuentes"
        fields:
          - label: "Lista de Preguntas Frecuentes"
            name: "preguntas"
            widget: "list"
            summary: "{{fields.pregunta}}"
            fields:
              - { label: "Pregunta", name: "pregunta", widget: "string" }
              - { label: "Respuesta (HTML)", name: "respuesta", widget: "text" }